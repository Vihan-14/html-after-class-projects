<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-areas:
                'header header header'
                'menu main main'
                'footer footer footer'


            ;
            background-color: rgb(2, 179, 255);
            padding: 10px;
            height: 500px;

        }

        div.grid-container>div {
            background-color: rgb(36, 117, 90);
            border: 2px solid rgb(252, 250, 250);
            padding: 20px;
            text-align: center;

        }

        .grid-item1 {
            grid-area: header;
        }

        .grid-item2 {
            grid-area: menu;
        }

        .grid-item3 {
            grid-area: main;
        }

        .grid-item4 {
            grid-area: footer;
        }
    </style>
</head>

<body>
    <div class="grid-container">
        <div class="grid-item1">
            header

        </div>
        <div class="grid-item2">
            menu

        </div>
        <div class="grid-item3">
            main content

        </div>
        <div class="grid-item4">
            footer

        </div>

    </div>


</body>

</html>
